# 生产：业务服务使用 GHCR 镜像（先 tag v* 触发 CI）。
# clone 后将 image 中的仓库名换成你的 org/repo，并按端口公式改宿主机端口。
services:
  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-game}
      POSTGRES_USER: ${POSTGRES_USER:-game}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-game_dev_pwd}
    volumes:
      - game_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-game}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  game-user-migrate:
    image: ghcr.io/longlonggames/gametemplate/game-user:${IMAGE_TAG:-latest}
    command: ["--migrate"]
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-game};Username=${POSTGRES_USER:-game};Password=${POSTGRES_PASSWORD:-game_dev_pwd}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  game-leaderboard-migrate:
    image: ghcr.io/longlonggames/gametemplate/game-leaderboard:${IMAGE_TAG:-latest}
    command: ["--migrate"]
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-game};Username=${POSTGRES_USER:-game};Password=${POSTGRES_PASSWORD:-game_dev_pwd}"
    depends_on:
      postgres:
        condition: service_healthy
      game-user-migrate:
        condition: service_completed_successfully
    restart: "no"

  game-core-migrate:
    image: ghcr.io/longlonggames/gametemplate/game-core:${IMAGE_TAG:-latest}
    command: ["--migrate"]
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-game};Username=${POSTGRES_USER:-game};Password=${POSTGRES_PASSWORD:-game_dev_pwd}"
    depends_on:
      postgres:
        condition: service_healthy
      game-leaderboard-migrate:
        condition: service_completed_successfully
    restart: "no"

  game-user:
    image: ghcr.io/longlonggames/gametemplate/game-user:${IMAGE_TAG:-latest}
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-game};Username=${POSTGRES_USER:-game};Password=${POSTGRES_PASSWORD:-game_dev_pwd}"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Secret: ${JWT_SECRET:-CHANGE_ME_TO_A_LONG_RANDOM_SECRET_IN_PRODUCTION}
      Jwt__Issuer: battle-net-mp
      Config__Root: /app/config
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      game-user-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  game-leaderboard:
    image: ghcr.io/longlonggames/gametemplate/game-leaderboard:${IMAGE_TAG:-latest}
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-game};Username=${POSTGRES_USER:-game};Password=${POSTGRES_PASSWORD:-game_dev_pwd}"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Secret: ${JWT_SECRET:-CHANGE_ME_TO_A_LONG_RANDOM_SECRET_IN_PRODUCTION}
      Jwt__Issuer: battle-net-mp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      game-leaderboard-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  game-core:
    image: ghcr.io/longlonggames/gametemplate/game-core:${IMAGE_TAG:-latest}
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-game};Username=${POSTGRES_USER:-game};Password=${POSTGRES_PASSWORD:-game_dev_pwd}"
      Jwt__Secret: ${JWT_SECRET:-CHANGE_ME_TO_A_LONG_RANDOM_SECRET_IN_PRODUCTION}
      Jwt__Issuer: battle-net-mp
    depends_on:
      postgres:
        condition: service_healthy
      game-core-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  game-gateway:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:80"
    depends_on:
      - game-user
      - game-leaderboard
      - game-core
    restart: unless-stopped

volumes:
  game_pgdata:
